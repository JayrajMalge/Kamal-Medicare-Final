<app-header></app-header>
<div class="main">
    <div class="content">
        <h3 contenteditable>Our Doctors</h3>
    </div>
    <div class="scroller">
        <div class="scrollable-container">
            <div class="scrollable-content">
              <div *ngFor="let spe of specializationarray" class="scroll-item" (click)="selectItem(spe.speacializationid)" [class.selected]="spe.speacializationid === selectedItem">
                 {{ spe.fieldname }}
             </div>       </div>
        </div>
    </div>
    <div class="doctors">
        <app-doctor-box *ngFor="let doc of doctorarray" [doc]="doc"></app-doctor-box>
    </div>
</div>
<app-footer></app-footer>
